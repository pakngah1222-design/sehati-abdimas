<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun | Sehati Abdimas 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0e3b2e', primary: '#1b5e4b', light: '#f4f6f0', accent: '#d4a373' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-light text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <nav class="bg-brand-dark text-white py-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Sehati Abdimas</h1>
            <a href="index.html" class="bg-brand-accent hover:bg-yellow-600 text-white font-semibold px-4 py-2 rounded-lg transition shadow text-sm">
                <i class="fa-solid fa-house mr-2"></i>Kembali ke Beranda
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100">
            <div class="text-center mb-8">
                <span class="bg-brand-primary text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">Pendaftaran Akun Baru</span>
                <h2 class="text-3xl font-extrabold text-brand-dark mt-2">Registrasi Peserta & Seminar</h2>
                <p class="text-sm text-gray-500 mt-1">Buat akun untuk mengakses dashboard, submit abstrak, dan jadwal Zoom.</p>
            </div>

            <!-- Setelah submit, diarahkan ke login.html -->
            <form action="login.html" method="GET" class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Nama Lengkap & Gelar</label>
                        <input type="text" placeholder="Contoh: Dadang, S.Kom." class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Alamat Email Aktif</label>
                        <input type="email" placeholder="nama@email.com" class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm" required>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Buat Password</label>
                        <input type="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Nomor WhatsApp</label>
                        <input type="tel" placeholder="081234567890" class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Asal Instansi / Perguruan Tinggi</label>
                    <input type="text" value="Politeknik Negeri Sambas" class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm" required>
                </div>

                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-2">Kategori Partisipasi</label>
                        <select class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm">
                            <option>Presenter (Submit Makalah)</option>
                            <option>Non-Presenter (Peserta Zoom)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-2">Pilihan Scope</label>
                        <select class="w-full px-4 py-2.5 bg-brand-light border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm">
                            <option>Teknologi Informasi</option>
                            <option>Pertanian</option>
                            <option>Pangan</option>
                            <option>Perikanan</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-brand-primary hover:bg-brand-dark text-white font-bold py-3 rounded-xl shadow-md transition duration-200 text-sm mt-4">
                    Daftar Akun Sekarang (Lanjut ke Halaman Login)
                </button>
            </form>

            <div class="text-center mt-6 text-xs text-gray-600">
                Sudah punya akun? <a href="login.html" class="text-brand-primary font-bold hover:underline">Login di sini</a>
            </div>
        </div>
    </main>

    <footer class="bg-brand-dark text-white py-4 text-center text-xs border-t border-brand-primary">
        <p>&copy; 2026 Politeknik Negeri Sambas. All Rights Reserved.</p>
    </footer>
</body>
</html>
